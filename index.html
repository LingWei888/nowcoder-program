<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: http://api-acnowcoder.exitcode.cn; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
  <title>EC监控工具</title>
  <style>
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; background: #222; overflow: hidden; font-family: sans-serif; }
    
    #toolbar { display: flex; background: #333; padding: 8px; align-items: center; gap: 10px; }
    #tabs { display: flex; flex: 1; overflow-x: auto; gap: 5px; }
    #tabs::-webkit-scrollbar { display: none; }
    
    .tab { background: #555; color: #ccc; padding: 6px 12px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; font-size: 13px; max-width: 200px; user-select: none; }
    .tab.active { background: #0078d4; color: white; font-weight: bold; }
    .tab-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; margin-right: 8px; pointer-events: none; }
    .close-btn { background: none; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; opacity: 0.7; }
    .close-btn:hover { background: rgba(255,0,0,0.8); opacity: 1; }

    #url-bar { width: 300px; padding: 6px 10px; border-radius: 4px; border: 1px solid #555; background: #444; color: #aaa; pointer-events: none; }
    #exit-btn { background: #d93025; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }

    .modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); backdrop-filter: blur(2px); visibility: hidden; opacity: 0; transition: opacity 0.2s ease, visibility 0.2s ease; z-index: 1000; }
    .modal.visible { visibility: visible; opacity: 1; }
    .modal-box { width: min(420px, calc(100% - 40px)); background: #1e1e1e; border-radius: 12px; padding: 24px; box-shadow: 0 16px 40px rgba(0,0,0,0.45); color: #f1f1f1; }
    .modal-box h2 { margin: 0 0 12px; font-size: 18px; }
    .modal-box p { margin: 0 0 18px; line-height: 1.6; color: #ccc; }
    .modal-box input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #444; background: #111; color: #eee; margin-bottom: 12px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .modal-actions button { min-width: 90px; padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; }
    .modal-actions .cancel-btn { background: #444; color: #ddd; }
    .modal-actions .confirm-btn { background: #d93025; color: white; }

    #content { flex: 1; position: relative; background: white; }
    webview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; visibility: hidden; }
    webview.active { visibility: visible; }
  </style>
</head>
<body>

  <div id="toolbar">
    <div id="tabs"></div>
    <input type="text" id="url-bar" readonly placeholder="当前网址...">
    <button id="exit-btn">退出比赛</button>
  </div>

  <div id="content"></div>

  <!-- 监控服务器选择模态框 -->
  <div id="monitor-modal" class="modal visible" role="dialog" aria-modal="true" aria-labelledby="monitor-modal-title">
    <div class="modal-box">
      <h2 id="monitor-modal-title">选择监控服务器</h2>
      <p>请选择一个在线的监控服务器来连接：</p>
      <div id="monitor-list" style="max-height: 200px; overflow-y: auto; margin-bottom: 12px;">
        <!-- 监控服务器列表将在这里显示 -->
      </div>
      <div class="modal-actions">
        <button class="confirm-btn" id="connect-monitor-btn">连接</button>
      </div>
    </div>
  </div>

  <div id="exit-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="exit-modal-title">
    <div class="modal-box">
      <h2 id="exit-modal-title">确认结束比赛</h2>
      <p>请输入下列口令以结束程序：</p>
      <p style="font-weight: 700; color: #fff;">「我同意结束这场比赛」</p>
      <input id="exit-confirm-input" type="text" placeholder="请输入完整口令" autocomplete="off">
      <div id="exit-error" style="min-height: 18px; color: #ff7b72; font-size: 13px; margin-bottom: 12px;"></div>
      <div class="modal-actions">
        <button class="cancel-btn" id="exit-cancel-btn">取消</button>
        <button class="confirm-btn" id="exit-confirm-btn">退出</button>
      </div>
    </div>
  </div>

  <script>
    // 配置信息（与 config.js 保持一致）
    const CONFIG = {
      MONITOR_API: {
        BASE_URL: 'http://api-acnowcoder.exitcode.cn',
        ENDPOINTS: {
          GET_MONITORS: '/monitors'
        }
      },
      EXAM: {
        URL: 'https://ac.nowcoder.com/',
        ALLOW_HOST_KEYWORD: 'nowcoder.com'
      },
      EXIT: {
        CONFIRM_TEXT: '我同意结束这场比赛'
      }
    };

    const EXAM_URL = CONFIG.EXAM.URL;
    const ALLOW_HOST_KEYWORD = CONFIG.EXAM.ALLOW_HOST_KEYWORD;
    const EXIT_CONFIRM_TEXT = CONFIG.EXIT.CONFIRM_TEXT;
    console.log('[renderer] 页面脚本启动');

    const tabsContainer = document.getElementById('tabs');
    const contentContainer = document.getElementById('content');
    const urlBar = document.getElementById('url-bar');
    let tabCount = 0;

    // 监控服务器相关
    let selectedMonitor = null;
    const monitorModal = document.getElementById('monitor-modal');
    const monitorList = document.getElementById('monitor-list');
    const connectMonitorBtn = document.getElementById('connect-monitor-btn');

    // 加载监控服务器列表
    async function loadMonitors() {
      try {
        const response = await fetch(`${CONFIG.MONITOR_API.BASE_URL}${CONFIG.MONITOR_API.ENDPOINTS.GET_MONITORS}`);
        const monitors = await response.json();

        monitorList.innerHTML = '';
        if (monitors.length === 0) {
          monitorList.innerHTML = '<p style="color: #ff7b72;">暂无在线的监控服务器</p>';
          connectMonitorBtn.disabled = true;
          return;
        }

        monitors.forEach(monitor => {
          const div = document.createElement('div');
          div.style.cssText = 'padding: 8px; border: 1px solid #444; border-radius: 4px; margin-bottom: 8px; cursor: pointer; background: #111;';
          div.innerHTML = `
            <strong>${monitor.school} - ${monitor.location}</strong><br>
            <small>IP: ${monitor.ip}</small>
          `;
          div.onclick = () => {
            document.querySelectorAll('#monitor-list > div').forEach(el => el.style.background = '#111');
            div.style.background = '#333';
            selectedMonitor = monitor;
            connectMonitorBtn.disabled = false;
          };
          monitorList.appendChild(div);
        });
      } catch (error) {
        console.error('Failed to load monitors:', error);
        monitorList.innerHTML = '<p style="color: #ff7b72;">加载监控服务器失败</p>';
      }
    }

    // 连接监控服务器
    connectMonitorBtn.onclick = () => {
      if (!selectedMonitor) return;

      // 发送选择的信息到主进程
      if (window.ecApi && window.ecApi.selectMonitor) {
        window.ecApi.selectMonitor(selectedMonitor);
        monitorModal.classList.remove('visible');
        // 开始考试
        createTab(EXAM_URL);
      }
    };

    // 加载监控服务器
    loadMonitors();

    function normalizeUrl(url) {
      try {
        return new URL(url).href;
      } catch (e) {
        const activeWebview = document.querySelector('webview.active');
        const base = activeWebview ? (activeWebview.getURL() || activeWebview.src) : EXAM_URL;
        try {
          return new URL(url, base).href;
        } catch (error) {
          console.warn('[renderer] normalizeUrl failed for', url, 'base', base, error.message);
          return url;
        }
      }
    }

    function getWebviewPreloadPath() {
      try {
        const url = new URL(window.location.href);
        let pathname = decodeURIComponent(url.pathname);
        if (/^\/([A-Za-z]:\/)/.test(pathname)) {
          pathname = pathname.slice(1);
        }
        return pathname.replace(/[/\\]index\.html$/, '/webview-preload.js');
      } catch (error) {
        console.warn('[renderer] getWebviewPreloadPath failed:', error.message);
        return '';
      }
    }

    function isAllowedUrl(urlString) {
      try {
        return new URL(urlString).hostname.includes(ALLOW_HOST_KEYWORD);
      } catch (e) {
        console.warn('[renderer] 无法解析 URL:', urlString, e.message);
        return false;
      }
    }

    function createTab(url) {
      const normalizedUrl = normalizeUrl(url);
      console.log('[renderer] createTab', url, '=>', normalizedUrl);
      const tabId = 'tab_' + tabCount++;
      
      // 1. 创建 UI 标签
      const tabEl = document.createElement('div');
      tabEl.className = 'tab';
      tabEl.id = 'ui_' + tabId;
      tabEl.innerHTML = `
        <span class="tab-title">加载中...</span>
        <button class="close-btn">×</button>
      `;
      
      tabEl.onclick = () => switchTab(tabId);
      tabEl.querySelector('.close-btn').onclick = (e) => {
        e.stopPropagation(); 
        closeTab(tabId);
      };
      tabsContainer.appendChild(tabEl);

      // 2. 创建 Webview 内核
      const webview = document.createElement('webview');
      webview.id = tabId;
      webview.src = normalizedUrl;
      webview.allowpopups = true;
      webview.partition = 'persist:exam'; // 配置 partition，确保事件传递
      const preloadPath = getWebviewPreloadPath();
      if (preloadPath) {
        webview.preload = preloadPath;
      } else {
        console.warn('[renderer] webview preload path 未设置');
      }
      console.log('[renderer] webview preload path:', preloadPath);

      webview.addEventListener('will-navigate', (e) => {
        if (!isAllowedUrl(e.url)) {
          webview.stop();
          alert('禁止访问比赛白名单以外的网址！');
        }
      });

      webview.addEventListener('did-navigate', (e) => {
        console.log('[renderer] webview did-navigate:', e.url);
        if (webview.classList.contains('active')) urlBar.value = e.url;
      });
      
      webview.addEventListener('page-title-updated', (e) => {
        console.log('[renderer] webview page-title-updated:', e.title);
        const titleEl = document.querySelector(`#ui_${tabId} .tab-title`);
        if (titleEl) titleEl.textContent = e.title;
      });
      webview.addEventListener('dom-ready', () => {
        console.log('[renderer] webview dom-ready:', tabId, webview.getURL());
      });
      webview.addEventListener('console-message', (e) => {
        console.log('[renderer] webview console-message:', e.message, 'source:', e.sourceId, 'line:', e.line);
      });
      webview.addEventListener('ipc-message', (e) => {
        if (e.channel === 'open-new-tab' && e.args && e.args[0]) {
          console.log('[renderer] webview ipc-message open-new-tab:', e.args[0]);
          const normalizedUrl = normalizeUrl(e.args[0]);
          if (isAllowedUrl(normalizedUrl)) {
            console.log('[renderer] webview ipc-message URL 合法，创建标签:', normalizedUrl);
            createTab(normalizedUrl);
          } else {
            console.warn('[renderer] webview ipc-message URL 不合法，拦截:', normalizedUrl);
            alert('禁止访问比赛白名单以外的链接！');
          }
        }
      });

      webview.addEventListener('new-window', (e) => {
        console.log('[renderer] webview new-window 事件:', e.url, 'disposition:', e.disposition);
        const normalizedUrl = normalizeUrl(e.url);
        if (isAllowedUrl(normalizedUrl)) {
          console.log('[renderer] webview new-window 合法，创建标签:', normalizedUrl);
          createTab(normalizedUrl);
        } else {
          console.warn('[renderer] webview new-window 不合法，拦截:', normalizedUrl);
          alert('禁止访问比赛白名单以外的链接！');
        }
        e.preventDefault();
      });

      contentContainer.appendChild(webview);
      
      setTimeout(() => switchTab(tabId), 50);
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('webview').forEach(el => el.classList.remove('active'));
      
      const activeUi = document.getElementById('ui_' + tabId);
      const activeWebview = document.getElementById(tabId);
      
      if (activeUi) activeUi.classList.add('active');
      if (activeWebview) {
        activeWebview.classList.add('active');
        try {
          urlBar.value = activeWebview.getURL() || activeWebview.src || '';
        } catch (e) {
          urlBar.value = activeWebview.src || '加载中...';
        }
      }
    }

    function closeTab(tabId) {
      const ui = document.getElementById('ui_' + tabId);
      const wv = document.getElementById(tabId);
      if (ui) ui.remove();
      if (wv) wv.remove();
      
      const remaining = document.querySelectorAll('.tab');
      if (remaining.length > 0) {
        switchTab(remaining[remaining.length - 1].id.replace('ui_', ''));
      } else {
        createTab(EXAM_URL);
      }
    }

    createTab(EXAM_URL);

    // 【正确的工作流】：接收主进程 web-contents-created 拦截到的新标签请求
    console.log('[renderer] ecApi available:', !!window.ecApi, window.ecApi);
    if (window.ecApi && typeof window.ecApi.onOpenNewTab === 'function') {
      console.log('[renderer] ecApi onOpenNewTab 注册中');
      window.ecApi.onOpenNewTab((url) => {
        console.log('[renderer] 收到新标签事件，url:', url);
        const normalizedUrl = normalizeUrl(url);
        if (isAllowedUrl(normalizedUrl)) {
          console.log('[renderer] URL 合法，创建标签:', normalizedUrl);
          createTab(normalizedUrl);
        } else {
          console.warn('[renderer] URL 不合法，拦截:', normalizedUrl);
          alert('禁止访问比赛白名单以外的链接！');
        }
      });
    } else {
      console.warn('[renderer] ecApi.onOpenNewTab 不可用');
    }

    const exitModal = document.getElementById('exit-modal');
    const exitInput = document.getElementById('exit-confirm-input');
    const exitError = document.getElementById('exit-error');
    const exitCancelBtn = document.getElementById('exit-cancel-btn');
    const exitConfirmBtn = document.getElementById('exit-confirm-btn');

    function openExitModal() {
      exitError.textContent = '';
      exitInput.value = '';
      exitModal.classList.add('visible');
      exitInput.focus();
    }

    function closeExitModal() {
      exitModal.classList.remove('visible');
    }

    async function submitExit() {
      if (!window.ecApi) {
        exitError.textContent = '通讯异常，请使用 Ctrl + Shift + Alt + Q 强制退出。';
        return;
      }

      const text = exitInput.value.trim();
      if (text !== EXIT_CONFIRM_TEXT) {
        exitError.textContent = '口令不正确，请输入完整口令。';
        return;
      }

      document.getElementById('exit-btn').disabled = true;
      document.getElementById('exit-btn').textContent = '正在强制退出...';
      try {
        await window.ecApi.requestExit(text);
      } catch (error) {
        exitError.textContent = '退出请求发送失败，请按 Ctrl + Shift + Alt + Q 强制退出。';
      }
    }

    document.getElementById('exit-btn').onclick = openExitModal;
    exitCancelBtn.onclick = closeExitModal;
    exitConfirmBtn.onclick = submitExit;
    exitInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') submitExit();
      if (event.key === 'Escape') closeExitModal();
    });
  </script>
</body>
</html>
